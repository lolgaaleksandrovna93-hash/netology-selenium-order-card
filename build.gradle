plugins {
    id 'java'
    id 'application' // <--- ЭТО ГЛАВНОЕ: добавляет манифест с Main-Class
}

group = 'ru.netology'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

application {
    mainClass = 'ru.netology.Main' // <--- Указываем твой класс из скриншота
}

dependencies {
    // Если нужны зависимости для тестов (Selenium и т.д.), добавляй сюда
}
