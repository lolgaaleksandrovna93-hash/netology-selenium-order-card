plugins {
    id 'java'
    // ДОБАВЛЕНО: Плагин Spring Boot для запуска приложения
    id 'org.springframework.boot' version '3.3.4' 
}

group 'ru.netology'
version '1.0-SNAPSHOT'

java {
    sourceCompatibility = 11
}

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

repositories {
    mavenCentral()
}

dependencies {
    // ДОБАВЛЕНО: Зависимость Spring Boot Web (чтобы приложение могло стартовать)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.29.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.9.3'
}

test {
    useJUnitPlatform()
    systemProperty 'chromeoptions.prefs', System.getProperty('chromeoptions.prefs', "profile.password_manager_leak_detection=false")
}

// ДОБАВЛЕНО: Задача для запуска приложения. 
// Тесты будут ждать, пока приложение полностью не поднимется.
bootRun {
    dependsOn build
}
