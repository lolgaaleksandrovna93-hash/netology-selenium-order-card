plugins {
    id 'java'
    // УБРАЛИ springBoot, так как у тебя обычный Java класс Main, а не Spring Boot
    id 'application' // ДОБАВИЛИ этот плагин для создания запускаемого JAR
}

group = 'ru.netology'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

// Указываем, какой класс является точкой входа
application {
    mainClass = 'ru.netology.Main'
}

dependencies {
    // Если для тестов нужен Selenium, оставь эту строку:
    // implementation 'org.seleniumhq.selenium:selenium-java:4.15.0'
}
