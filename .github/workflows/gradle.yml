name: Java CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Клонируем репозиторий
      - uses: actions/checkout@v4

      # Устанавливаем JDK
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      # Запускаем SUT (System Under Test) в фоне
      - name: Запуск SUT (System Under Test)
        run: |
          java -jar ./artifacts/app-order.jar &

      # Ждём запуска приложения
      - name: Wait for SUT to start
        run: sleep 5

      - name: Make gradlew executable
        run: chmod +x ./

      # Собираем проект и запускаем тесты
      - name: Build and test with Gradle
        run: ./gradlew test