name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      
      # ИСПРАВЛЕНО: Java 17 вместо 11
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Сборка проекта (создаст JAR)
      - name: Build application
        shell: powershell
        run: .\gradlew.bat build -x test

      # Запуск SUT
      - name: Launch SUT (System Under Test)
        shell: powershell
        run: |
          # Находим любой JAR в папке build/libs
          \$jarPath = Get-ChildItem -Path ".\build\libs" -Filter "*.jar" | Select-Object -First 1 -ExpandProperty FullName
          
          if (-not \$jarPath) {
            Write-Error "JAR file not found. Did build step fail?"
            exit 1
          }
          
          Write-Host "Starting SUT from: \$jarPath"
          
          # Запускаем в фоне
          Start-Process -FilePath java `
            -ArgumentList "-jar", \$jarPath, "--server.port=9999" `
            -NoNewWindow
            
          Write-Host "SUT started. Waiting for readiness..."

      # ИСПРАВЛЕНО: Умное ожидание вместо слепого сна
      - name: Wait for application to be ready
        shell: powershell
        run: |
          \$maxAttempts = 40
          \$attempt = 0
          \$url = "http://localhost:9999/"
          
          while ($attempt -lt $maxAttempts) {
            try {
              # HEAD запрос быстрее и легче, чем GET
              $response = Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 5 -UseBasicParsing
              if (\$response.StatusCode -eq 200) {
                Write-Host "✅ Application is ready!"
                break
              }
            }
            catch {
              Write-Host "⏳ Waiting for application... (attempt $($attempt + 1)/\$maxAttempts)"
            }
            Start-Sleep -Seconds 2
            \$attempt++
          }

          if ($attempt -eq $maxAttempts) {
            Write-Error "❌ Application failed to start within time limit."
            exit 1
          }

      # Запуск тестов
      - name: Run tests with Gradle
        shell: powershell
        run: .\gradlew.bat test --stacktrace
