name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 1. Сборка
      - name: Build application
        shell: powershell
        run: .\gradlew.bat build -x test

      # 2. Запуск SUT в фоне (ИСПРАВЛЕНО: используем CMD вместо PowerShell)
      # CMD не ломается от экранирования символов в YAML и стабильно запускает процессы в фоне через start /B
      - name: Launch SUT (Background)
        shell: cmd
        run: |
          @echo off
          REM Ищем первый JAR файл в папке build/libs
          for /f "delims=" %%i in ('dir .\build\libs\*.jar /b') do set "JAR_FILE=%%i" & goto :found
          :found
          
          if "%JAR_FILE%"=="" (
            echo ERROR: JAR file not found in .\build\libs!
            exit /b 1
          )
          
          echo Found JAR: %JAR_FILE%
          echo Launching SUT on port 9999...
          
          REM start /B запускает процесс в фоне без открытия нового окна.
          REM Управление сразу возвращается следующему шагу пайплайна.
          start /B java -jar .\build\libs\%JAR_FILE% --server.port=9999
          
          echo SUT started successfully.

      # 3. Ждем готовности приложения
      - name: Wait for application to be ready
        shell: powershell
        run: |
          \$maxAttempts = 40
          \$attempt = 0
          \$url = "http://localhost:9999/"
          
          while ($attempt -lt $maxAttempts) {
            try {
              $response = Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 5 -UseBasicParsing
              if (\$response.StatusCode -eq 200) {
                Write-Host "✅ Application is ready!"
                break
              }
            }
            catch {
              Write-Host "⏳ Waiting for application... (attempt $($attempt + 1)/\$maxAttempts)"
            }
            Start-Sleep -Seconds 2
            \$attempt++
          }

          if ($attempt -eq $maxAttempts) {
            Write-Error "❌ Application failed to start within time limit."
            exit 1
          }

      # 4. Запуск тестов
      - name: Run tests with Gradle
        shell: powershell
        run: .\gradlew.bat test --stacktrace

      # 5. Очистка: убиваем зависшие процессы Java в конце джобы
      # Выполняется всегда (даже если тесты упали), чтобы освободить порт 9999 для следующих запусков
      - name: Stop SUT (Cleanup)
        if: always()
        shell: cmd
        run: |
          @echo off
          echo Stopping any remaining Java processes...
          REM taskkill /F принудительно убивает все процессы java.exe на раннере.
          REM В среде GitHub Actions это безопасно, так как раннер одноразовый.
          taskkill /F /IM java.exe >nul 2>&1
          echo Cleanup complete.
