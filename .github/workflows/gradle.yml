name: Java CI
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Запуск SUT (System Under Test)
        run: Start-Process -FilePath java -ArgumentList "-jar", ".\artifacts\app-order.jar" -NoNewWindow
      - name: Wait for SUT to start
        shell: cmd
        run: timeout /t 5 /nobreak
      - name: Build and test with Gradle
        run: .\gradlew.bat test