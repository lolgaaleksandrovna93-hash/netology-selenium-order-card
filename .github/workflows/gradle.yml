name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Check if artifact exists
        shell: pwsh
        run: |
          \$artifactPath = ".\artifacts\app-order.jar"
          if (-not (Test-Path \$artifactPath)) {
            Write-Error "Artifact file not found at \$artifactPath. Build may have failed."
            exit 1
          }

      - name: Launch SUT (System Under Test)
        shell: cmd
        run: start /B java -jar .\artifacts\app-order.jar -Dserver.port=9999

      - name: Wait for SUT to be ready
        shell: pwsh
        run: |
          \$maxAttempts = 30
          \$attempt = 0
          while ($attempt -lt $maxAttempts) {
            try {
              \$response = Invoke-WebRequest -Uri "http://localhost:9999" -Method Head -TimeoutSec 5 -ErrorAction Stop
              if (\$response.StatusCode -eq 200) {
                Write-Host "SUT is ready!"
                break
              }
            } catch {
              Write-Host "SUT not ready yet, waiting... ($attempt/$maxAttempts)"
            }
            Start-Sleep -Seconds 2
            \$attempt++
          }
          if ($attempt -eq $maxAttempts) {
            Write-Error "SUT failed to start within timeout"
            exit 1
          }

      - name: Build and test with Gradle 🚀
        run: .\gradlew.bat test --stacktrace
