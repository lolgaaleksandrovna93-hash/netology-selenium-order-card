name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Сборка
      - name: Build application
        shell: powershell
        run: .\gradlew.bat build -x test

      # Запуск SUT
      - name: Launch SUT (Background)
        shell: cmd
        run: |
          @echo off
          echo Searching for JAR...
          for /f "delims=" %%i in ('dir .\build\libs\*.jar /b') do set "JAR_FILE=%%i"
          
          if "%JAR_FILE%"=="" (
            echo ERROR: JAR not found!
            exit /b 1
          )
          
          echo Found: %JAR_FILE%
          echo Launching SUT...
          
          REM Запуск в фоне. 
          REM ВАЖНО: Если это НЕ Spring Boot, а простой Main.java, он НЕ откроет порт 9999.
          start /B "" java -jar .\build\libs\%JAR_FILE%
          
          echo SUT started.

      # Ожидание готовности (ИСПРАВЛЕНО: убраны \$)
      - name: Wait for application to be ready
        shell: powershell
        run: |
          # Убрали \ перед \$, теперь это валидные переменные PowerShell
          \$maxAttempts = 60
          \$attempt = 0
          \$url = "http://localhost:9999/"

          while ($attempt -lt $maxAttempts) {
            try {
              $response = Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 5 -UseBasicParsing
              if (\$response.StatusCode -eq 200) {
                Write-Host "🟢 Application is ready!"
                break
              }
            } catch {
              # Игнорируем ошибки соединения, ждем дальше
            }

            Start-Sleep -Seconds 2
            \$attempt++
            Write-Host "⏳ Waiting... Attempt $($attempt + 1)/\$maxAttempts"
          }

          if ($attempt -ge $maxAttempts) {
            Write-Error "🛑 Application failed to start within time limit."
            exit 1
          }

      # Тесты
      - name: Run tests with Gradle
        shell: powershell
        run: .\gradlew.bat test --stacktrace

      # Очистка
      - name: Stop SUT (Cleanup)
        if: always()
        shell: cmd
        run: |
          @echo off
          taskkill /F /IM java.exe >nul 2>&1
          echo Cleanup complete.
