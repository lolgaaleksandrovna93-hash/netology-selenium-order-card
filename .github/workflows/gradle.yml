name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      # ШАГ 1: Сборка проекта (создаст jar или подготовит классы)
      - name: Build application
        shell: powershell
        run: .\gradlew.bat build -x test

      # ШАГ 2: Запуск приложения в фоновом режиме
      - name: Launch SUT (System Under Test)
        shell: powershell
        run: |
          # Запускаем jar в фоне. Используем правильный синтаксис для порта Spring Boot
          \$jarPath = ".\build\libs\app-order.jar"
          if (-not (Test-Path \$jarPath)) {
            Write-Error "Jar file not found at \$jarPath. Did build step fail?"
            exit 1
          }
          Start-Process -FilePath java `
            -ArgumentList "-jar", \$jarPath, "--server.port=9999" `
            -NoNewWindow
          
          Write-Host "Application started. Waiting for readiness..."

      # ШАГ 3: Ожидание готовности приложения (Критически важно!)
      - name: Wait for application to be ready
        shell: powershell
        run: |
          \$maxAttempts = 30
          \$attempt = 0
          \$url = "http://localhost:9999/"
          
          while ($attempt -lt $maxAttempts) {
            try {
              $response = Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 5 -UseBasicParsing
              if (\$response.StatusCode -eq 200) {
                Write-Host "✅ Application is ready!"
                break
              }
            }
            catch {
              Write-Host "⏳ Waiting for application... (attempt $($attempt + 1)/\$maxAttempts)"
            }
            Start-Sleep -Seconds 2
            \$attempt++
          }

          if ($attempt -eq $maxAttempts) {
            Write-Error "❌ Application failed to start within time limit."
            exit 1
          }

      # ШАГ 4: Запуск тестов
      - name: Run tests with Gradle
        shell: powershell
        run: .\gradlew.bat test --stacktrace
