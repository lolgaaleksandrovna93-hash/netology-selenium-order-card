name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Установка JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Сборка (без тестов)
      - name: Build application
        shell: powershell
        run: .\gradlew.bat build -x test

      # Запуск SUT в фоне с проверкой наличия JAR-файла
      - name: Launch SUT (Background)
        id: launch_sut
        shell: cmd
        run: |>>
          @echo off
          REM Проверяем наличие JAR файла перед запуском
          if not exist ".\build\libs\*.*" (
            echo ERROR: No JAR file found in ./build/libs!
            exit /b 1
          )

          REM Находим первый JAR файл
          for /f "delims=" %%i in ('dir .\build\libs\*.jar /b') do set "JAR_FILE=%%i"

          REM Запускаем приложение на порту 9999
          start /B "" java -jar .\build\libs\%JAR_FILE% --server.port=9999
          echo Application launched successfully.

      # Ждём готовности приложения
      - name: Wait for application to be ready
        shell: powershell
        run: |>>
          $maxAttempts = 60  # Увеличено время ожидания до 2 минут
          $attempt = 0
          $url = "http://localhost:9999/"

          while ($attempt -lt $maxAttempts) {
            try {
              $response = Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 5 -UseBasicParsing
              if ($response.StatusCode -eq 200) {
                Write-Host "🟢 Application is ready!"
                break
              }
            } catch {}

            Start-Sleep -Seconds 2
            $attempt++
            Write-Host "⏳ Waiting... Attempt $($attempt + 1)/$maxAttempts"
          }

          if ($attempt -ge $maxAttempts) {
            Write-Error "🛑 Application failed to start within time limit."
            exit 1
          }

      # Тесты
      - name: Run tests with Gradle
        shell: powershell
        run: .\gradlew.bat test --stacktrace

      # Очистка окружения (убиваем все процессы Java)
      - name: Stop SUT (Cleanup)
        if: always()
        shell: cmd
        run: |
          @echo off
          taskkill /F /IM java.exe >nul 2>&1 || echo ✅ Cleanup complete.
