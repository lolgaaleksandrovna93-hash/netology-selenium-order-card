name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: .\gradlew.bat build --no-daemon

      - name: Launch SUT and Run Tests
        shell: cmd
        env:
          SERVER_PORT: '9999'
        run: |
          @echo [INFO] ==========================================
          @echo [INFO] STEP 1: Checking for app-order.jar...
          
          if not exist "artifacts\app-order.jar" (
            echo [ERROR] CRITICAL: File artifacts\app-order.jar NOT FOUND!
            echo [ERROR] You must add the jar file to your repository using: git add -f artifacts/app-order.jar
            exit /b 1
          )
          
          @echo [INFO] STEP 2: Starting SUT (java -jar)...
          start "" /B java -jar artifacts\app-order.jar
          
          @echo [INFO] STEP 3: Waiting for SUT to initialize (120 seconds)...
          @echo [INFO] This long wait is required for slow GitHub Actions runners.
          
          for /L %%i in (1,1,24) do (
            timeout /t 5 /nobreak > nul
            echo [WAIT] Waiting... %%i/24 (Total: %%i*5 sec)
          )
          
          @echo [INFO] STEP 4: Running Selenium/Selenide Tests...
          .\gradlew.bat test --info --stacktrace
          
          if %errorlevel% neq 0 (
            echo [ERROR] TESTS FAILED with exit code %errorlevel%
            exit /b 1
          )
          
          echo [SUCCESS] All tests passed!
