name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Сборка (без тестов, чтобы сначала проверить запуск SUT)
      - name: Build application
        shell: powershell
        run: .\gradlew.bat build -x test

      # Запуск SUT в фоне
      - name: Launch SUT (Background)
        shell: cmd
        run: |
          @echo off
          echo Searching for JAR file...
          
          REM Ищем первый JAR файл в папке build/libs
          for /f "delims=" %%i in ('dir .\build\libs\*.jar /b') do set "JAR_FILE=%%i"
          
          if "%JAR_FILE%"=="" (
            echo ERROR: No JAR file found in ./build/libs!
            exit /b 1
          )
          
          echo Found JAR: %JAR_FILE%
          echo Launching SUT...
          
          REM ВАЖНО: Убрали --server.port=9999. 
          REM Порт 9999 должен быть настроен внутри приложения (application.properties).
          start /B "" java -jar .\build\libs\%JAR_FILE%
          
          echo SUT started successfully.

      # Ждём готовности приложения
      - name: Wait for application to be ready
        shell: powershell
        run: |
          \$maxAttempts = 60
          \$attempt = 0
          \$url = "http://localhost:9999/"

          while ($attempt -lt $maxAttempts) {
            try {
              # Head запрос не загружает тело страницы, только заголовки
              $response = Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 5 -UseBasicParsing
              if (\$response.StatusCode -eq 200) {
                Write-Host "🟢 Application is ready!"
                break
              }
            } catch {
              # Игнорируем ошибки соединения, ждем дальше
            }

            Start-Sleep -Seconds 2
            \$attempt++
            Write-Host "⏳ Waiting... Attempt $($attempt + 1)/\$maxAttempts"
          }

          if ($attempt -ge $maxAttempts) {
            Write-Error "🛑 Application failed to start within time limit."
            Write-Error "Check the logs above to see if the Spring Boot app started correctly."
            exit 1
          }

      # Тесты
      - name: Run tests with Gradle
        shell: powershell
        run: .\gradlew.bat test --stacktrace

      # Очистка окружения
      - name: Stop SUT (Cleanup)
        if: always()
        shell: cmd
        run: |
          @echo off
          echo Stopping any remaining Java processes...
          taskkill /F /IM java.exe >nul 2>&1
          echo Cleanup complete.

