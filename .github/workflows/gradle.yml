name: Java CI with Selenium

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest # Linux лучше для headless Chrome, чем Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: gradle

      # ВАЖНО: Если app-order.jar уже в репозитории (как сказано в задании), этот шаг не нужен.
      # Но если его нет, раскомментируй и укажи ссылку на скачивание.
      # - name: Download SUT Jar
      #   run: wget https://example.com/app-order.jar -O artifacts/app-order.jar

      - name: Verify SUT Jar exists
        run: ls -la artifacts/

      - name: Start SUT (System Under Test)
        # Запускаем приложение в фоне. Оно будет слушать порт 9999.
        # Если порт занят, можно добавить -port=7777
        run: java -jar artifacts/app-order.jar -port=9999 &

      - name: Wait for SUT to be ready
        # Ждем, пока порт 9999 станет доступен
        run: |
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:9999/; then
              echo "SUT is up!"
              break
            else
              echo "Waiting for SUT... (\$i/30)"
              sleep 2
            fi
          done

      - name: Build and Run Tests
        run: ./gradlew test --stacktrace