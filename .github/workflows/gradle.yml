name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      
      # Установка JDK и Gradle-кэша
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      # Проверка существования файла до запуска SUT
      - name: Check if artifact exists
        run: |
          $artifactPath = ".\artifacts\app-order.jar"
          if (-not(Test-Path $artifactPath)) {
            Write-Error "Artifact file not found at $artifactPath. Build may have failed."
            exit 1
          }

      # Запуск тестируемого приложения
      - name: Launch SUT (System Under Test)
        shell: powershell
        run: |
          Start-Process -FilePath java `
            -ArgumentList "-jar", "$(Get-Location)\artifacts\app-order.jar", "-Dserver.port=9999" `
            -NoNewWindow

      # Задержка прямо перед запуском тестов
      - name: Build and test with Gradle 🚀
        shell: powershell
        run: |
          # Ждём 5 секунд, пока приложение поднимется
          Start-Sleep -Seconds 5
          .\gradlew.bat test --stacktrace
