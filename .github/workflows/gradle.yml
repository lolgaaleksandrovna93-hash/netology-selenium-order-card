name: Java CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # SUT живёт только внутри этого шага, поэтому старт, ожидание и тесты — вместе
      - name: Run tests with SUT
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "java" `
            -ArgumentList "-jar", "./artifacts/app-mbank.jar" `
            -RedirectStandardOutput "sut.log" `
            -RedirectStandardError "sut.err.log" `
            -PassThru

          $port = 9999
          $timeout = 60
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            try {
              $client = New-Object Net.Sockets.TcpClient
              $client.Connect("localhost", $port)
              $client.Close()
              Write-Host "SUT is up on port $port"
              break
            } catch {
              Start-Sleep -Seconds 1
              $elapsed++
            }
          }
          if ($elapsed -ge $timeout) {
            Get-Content sut.log -ErrorAction SilentlyContinue
            Get-Content sut.err.log -ErrorAction SilentlyContinue
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "SUT did not start within $timeout seconds"
          }

          ./gradlew.bat test --no-daemon
          $testsFailed = ($LASTEXITCODE -ne 0)

          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue

          Write-Host "=== sut.log ==="
          Get-Content sut.log -ErrorAction SilentlyContinue
          Write-Host "=== sut.err.log ==="
          Get-Content sut.err.log -ErrorAction SilentlyContinue

          if ($testsFailed) { exit 1 }
